name: Coleta eSoccerBet

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'collector/**'
      - 'requirements.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: esoccer-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Coletar e salvar
        env:
          INGEST_URL: https://pybojmdmilhbkbhntuaf.supabase.co/functions/v1/github-ingest
        run: python -m collector.main

      - name: Guardar diagnóstico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-debug-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
